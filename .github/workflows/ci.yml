name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install proxy dependencies
        run: pip install -r requirements.txt

      - name: Compile proxy
        run: python -m py_compile app.py

      - name: Smoke import Flask app
        run: |
          python - <<'PY'
          from app import app
          client = app.test_client()

          r = client.get("/")
          assert r.status_code == 401, r.status_code

          r = client.get("/", headers={"Authorization": "Bearer test-key-not-real"})
          # Upstream call may fail; we only require a well-formed HTTP response
          assert r.status_code < 600, r.status_code

          r = client.get("/download")
          assert r.status_code == 400, r.status_code
          print("smoke ok")
          PY

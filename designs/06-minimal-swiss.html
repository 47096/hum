<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI Music · Minimal Swiss</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --border: #000000;
    --fg: #000000;
    --muted: #666666;
    --accent: #0000ff;
    --font-body: 'Helvetica Neue', 'Arial', sans-serif;
    --font-display: 'Helvetica Neue', 'Arial', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 var(--font-body);
    padding: 60px 40px;
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 60px;
    padding-bottom: 40px;
    border-bottom: 2px solid var(--fg);
  }

  h1 {
    font-family: var(--font-display);
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -3px;
    line-height: 1;
    margin-bottom: 16px;
  }

  .subtitle {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card {
    margin-bottom: 40px;
    padding-bottom: 40px;
    border-bottom: 1px solid var(--border);
  }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    font-weight: 700;
  }

  input, textarea, select {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--border);
    color: var(--fg);
    padding: 12px 0;
    font-family: var(--font-body);
    font-size: 16px;
    margin-bottom: 20px;
    transition: border-color 0.3s;
  }

  input:focus, textarea:focus, select:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }

  textarea {
    min-height: 120px;
    resize: vertical;
    border: 2px solid var(--border);
    padding: 16px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }

  .chip {
    background: transparent;
    border: 2px solid var(--border);
    color: var(--fg);
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .chip:hover, .chip.active {
    background: var(--fg);
    color: var(--bg);
  }

  .generate-btn {
    background: var(--fg);
    color: var(--bg);
    border: none;
    padding: 18px 36px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
    margin-top: 24px;
    transition: all 0.2s;
  }

  .generate-btn:hover {
    background: var(--accent);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .dot {
    width: 8px;
    height: 8px;
    background: var(--muted);
  }

  .dot.active {
    background: var(--accent);
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    50% { opacity: 0.5; }
  }

  .player {
    margin-top: 20px;
  }

  audio {
    width: 100%;
    margin-bottom: 20px;
  }

  .meta {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 20px;
  }

  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .action-btn {
    background: transparent;
    border: 2px solid var(--border);
    color: var(--fg);
    padding: 12px 24px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .action-btn:hover {
    background: var(--fg);
    color: var(--bg);
  }

  .toggle {
    width: 44px;
    height: 24px;
    background: transparent;
    border: 2px solid var(--border);
    position: relative;
    cursor: pointer;
    display: inline-block;
    transition: all 0.2s;
  }

  .toggle::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    background: var(--border);
    top: 2px;
    left: 2px;
    transition: all 0.2s;
  }

  .toggle.active {
    background: var(--fg);
  }

  .toggle.active::after {
    background: var(--bg);
    left: 22px;
  }

  .history-item {
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .history-title {
    font-weight: 700;
    font-size: 16px;
  }

  .history-date {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 4px;
  }

  @media (max-width: 600px) {
    body { padding: 30px 20px; }
    h1 { font-size: 48px; letter-spacing: -2px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>AI<br>Music</h1>
    <div class="subtitle">Generator</div>
  </header>

  <div class="card">
    <label>API</label>
    <select>
      <option>GMI Cloud</option>
      <option>MiniMax</option>
    </select>
    <input type="password" placeholder="API Key" />
  </div>

  <div class="card">
    <label>Genre</label>
    <div class="chips">
      <span class="chip active">Pop</span>
      <span class="chip">Rock</span>
      <span class="chip">Hip-hop</span>
      <span class="chip">Electronic</span>
      <span class="chip">Jazz</span>
      <span class="chip">R&B</span>
    </div>
    <label>Subgenres</label>
    <div class="chips">
      <span class="chip active">Dance Pop</span>
      <span class="chip">Electropop</span>
      <span class="chip">Indie Pop</span>
      <span class="chip">Synthpop</span>
    </div>
  </div>

  <div class="card">
    <label>Prompt</label>
    <input type="text" value="Upbeat dance pop, bright major key, punchy electronic drums" />

    <label>Lyrics</label>
    <textarea placeholder="[verse]\nYour lyrics here...\n\n[chorus]\nThe catchy hook goes here"></textarea>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
      <div class="toggle active"></div>
      <span style="font-size:13px;font-weight:700;letter-spacing:1px;">INSTRUMENTAL</span>
    </div>

    <label>Templates</label>
    <div class="chips">
      <span class="chip">Morning Coffee</span>
      <span class="chip">Gym Pump-up</span>
      <span class="chip">Study Focus</span>
      <span class="chip">Sunset Drive</span>
      <span class="chip">Party Starter</span>
    </div>

    <button class="generate-btn">Generate</button>

    <div class="status">
      <div class="dot active"></div>
      <span>COMPOSING — 45S</span>
    </div>
  </div>

  <div class="card">
    <label>Output</label>
    <div class="player">
      <audio controls></audio>
      <div class="meta">
        128.5S · 44100 HZ · 2 CH · 256 KBPS · MP3
      </div>
      <div class="actions">
        <button class="action-btn">Download</button>
        <button class="action-btn">Open</button>
      </div>
    </div>
  </div>

  <div class="card">
    <label>Settings</label>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
      <select>
        <option>44100 Hz</option>
        <option>32000 Hz</option>
        <option>24000 Hz</option>
      </select>
      <select>
        <option>256 kbps</option>
        <option>128 kbps</option>
        <option>64 kbps</option>
      </select>
      <select>
        <option>MP3</option>
        <option>WAV</option>
        <option>PCM</option>
      </select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:16px;">
      <select>
        <option>BPM: Auto</option>
        <option>120 BPM</option>
        <option>140 BPM</option>
      </select>
      <select>
        <option>Key: Auto</option>
        <option>C Major</option>
        <option>A Minor</option>
      </select>
      <select>
        <option>Mode: Auto</option>
        <option>Major</option>
        <option>Minor</option>
      </select>
    </div>
  </div>

  <div class="card">
    <label>History</label>
    <div class="history-item">
      <div>
        <div class="history-title">Summer Vibes</div>
        <div class="history-date">2026-09-01 14:30</div>
      </div>
      <button class="action-btn">Play</button>
    </div>
    <div class="history-item">
      <div>
        <div class="history-title">Midnight Drive</div>
        <div class="history-date">2026-09-01 12:15</div>
      </div>
      <button class="action-btn">Play</button>
    </div>
  </div>
</div>
</body>
</html>
